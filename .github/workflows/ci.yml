name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: task-test
          POSTGRES_DB: task_drive_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Test Google Drive reconnect with PostgreSQL
        env:
          GOOGLE_DRIVE_TEST_DATABASE_URL: postgresql://postgres:task-test@localhost:5432/task_drive_test
        run: node --test apps/api/dist/integrations/google-drive-reconnect.integration.test.js

      - name: Check generated contracts
        run: npm run check:generated
